<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI 분석 리포트</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #1e1e1e; padding: 25px; border-radius: 12px; }
        .date { font-size: 14px; color: #aaaaaa; margin-bottom: 10px; }
        .title { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .summary { font-size: 16px; line-height: 1.6; color: #dddddd; margin-bottom: 30px; border-left: 3px solid #555; padding-left: 15px; }

        .impact-section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .impact-card { background-color: #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .impact-header { display: flex; align-items: center; margin-bottom: 10px; font-weight: bold; font-size: 16px; }

        /* 긍정/부정 뱃지 스타일 */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-left: 10px; }
        .badge.POSITIVE { background-color: rgba(255, 69, 58, 0.2); color: #ff453a; } /* 붉은색 (긍정) */
        .badge.NEGATIVE { background-color: rgba(10, 132, 255, 0.2); color: #0a84ff; } /* 푸른색 (부정) */
        .badge.NEUTRAL { background-color: rgba(152, 152, 157, 0.2); color: #98989d; } /* 회색 (중립) */

        .reasoning { font-size: 14px; color: #cccccc; line-height: 1.5; margin-bottom: 10px; }
        .stocks { font-size: 13px; color: #888888; }
        .stocks strong { color: #aaaaaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="date" th:text="${#temporals.format(analysis.analysisDate, 'yyyy년 MM월 dd일')}">2026년 06월 12일</div>
    <div class="title" th:text="${analysis.issueTitle}">분석 제목</div>
    <div class="summary" th:text="${analysis.summary}">AI가 요약한 핵심 내용이 이곳에 표시됩니다.</div>

    <div class="impact-section-title">어떤 영향을 줄까?</div>

    <th:block th:each="impact : ${analysis.impacts}">
        <div class="impact-card">
            <div class="impact-header">
                <span th:text="${impact.sectorName}">섹터명</span>
                <span th:class="'badge ' + ${impact.impactType}" th:text="${impact.impactType.name() == 'POSITIVE' ? '긍정' : (impact.impactType.name() == 'NEGATIVE' ? '부정' : '중립')}">상태</span>
            </div>
            <div class="reasoning" th:text="${impact.reasoning}">해당 섹터에 미치는 영향 분석 내용입니다.</div>
            <div class="stocks"><strong>연관된 종목: </strong> <span th:text="${impact.relatedStocks}">관련 종목들</span></div>
        </div>
    </th:block>

    <div th:if="${#lists.isEmpty(analysis.impacts)}" style="color: #888; font-size: 14px;">
        등록된 파급 효과(Impact) 데이터가 없습니다.
    </div>
</div>

</body>
</html>
